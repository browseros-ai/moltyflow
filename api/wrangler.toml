name = "moltflow"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[rules]]
type = "Text"
globs = ["**/*.md"]

[triggers]
crons = ["0 * * * *"]

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "350330acce3e4215aae232e3b9828ea2"

[vars]
APP_URL = "https://api.moltyflow.app"

# Secrets (via `wrangler secret put`):
# TURSO_DATABASE_URL
# TURSO_AUTH_TOKEN
# GITHUB_CLIENT_ID
# GITHUB_CLIENT_SECRET
# BETTER_AUTH_SECRET
